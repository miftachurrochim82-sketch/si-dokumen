<script>
// SIDOKUMEN - J_Api.html (v1.0.3 — loadTren12Bulan)
window.SidokumenApi = {
  methods: {
    async loadAll(silent) {
      var s = silent === true;
      await Promise.all([
        this.loadDashboard(s),
        this.loadMasterSatelit(s),
        this.loadDokumen(1, s),
        this.loadJenis(),
        this.loadRtl(1, s),
        this.loadRekapKlasifikasi(s),
        this.loadTren12Bulan()
      ]);
    },

    // Tren 12 bulan — dua pemanggilan L7 (tahun ini + tahun lalu) agar
    // akurat lintas tahun, bukan sekadar 20 baris halaman pertama.
    async loadTren12Bulan() {
      try {
        var now = new Date();
        var resNow = await this.callServer('laporan_rekap_periode', { tahun: String(now.getFullYear()) });
        var resPrev = await this.callServer('laporan_rekap_periode', { tahun: String(now.getFullYear() - 1) });
        var keys = [], counts = {};
        for (var i = 11; i >= 0; i--) {
          var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          var k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
          keys.push(k);
          counts[k] = 0;
        }
        [resPrev, resNow].forEach(function (res) {
          if (res && res.success && res.data) {
            (res.data.rekap || []).forEach(function (r) {
              if (counts[r.periode] !== undefined) counts[r.periode] += Number(r.jml) || 0;
            });
          }
        });
        this.trenBulanan = { keys: keys, counts: counts };
      } catch (e) { /* silent — chart pakai fallback sample */ }
    },

    // ============ DASHBOARD ============
    async loadDashboard(silent) {
      var isSilent = silent === true;
      try {
        var res = await this.callServer('get_dashboard');
        if (res && res.success && res.data) {
          this.dashboardData = Object.assign({
            totalDokumen: 0, totalBaru: 0, totalDisetujui: 0, pctLengkap: 0,
            totalPegawai: 0, totalJenis: 0, tahun: String(new Date().getFullYear()),
            role: 'viewer', nama: '', totalRtl: 0, rtlBaru: 0, rtlSelesai: 0
          }, res.data);
        } else if (!isSilent) {
          this.showToast('Gagal memuat dashboard', 'error');
        }
      } catch (e) { if (!isSilent) this.showToast('Error koneksi dashboard', 'error'); }
    },

    // ============ MASTER SATELIT ============
    async loadMasterSatelit() {
      try {
        var res = await this.callServer('get_master_satelit');
        if (res && res.success && res.data) {
          this.masterPegawaiList = res.data.pegawai || [];
          this.jenisList = res.data.jenis || this.jenisList || [];
          this.kategoriList = res.data.kategori || [];
        }
      } catch (e) { /* silent */ }
    },
    async loadJenis() {
      try {
        var res = await this.callServer('get_jenis_list', {});
        if (res && res.success) this.jenisList = res.data || [];
      } catch (e) { /* silent */ }
    },

    // ============ DOKUMEN ============
    async loadDokumen(page, silent) {
      this.dokumenLoading = true;
      try {
        var p = page || this.dokumenPage || 1;
        var res = await this.callServer('get_dokumen_list', {
          page: p,
          search: this.dokumenFilters.search,
          tahun: this.dokumenFilters.tahun,
          jenis_dokumen_id: this.dokumenFilters.jenis_dokumen_id,
          status: this.dokumenFilters.status,
          pegawai_id: this.dokumenFilters.pegawai_id,
          per_page: this.dokumenPerPage
        });
        if (res && res.success) {
          this.dokumenList = res.data || [];
          this.dokumenTotalData = res.total || this.dokumenList.length;
          this.dokumenTotalPagesServer = res.total_pages || 1;
          this.dokumenPage = res.page || p;
        } else if (silent !== true) {
          this.showToast(res.error || 'Gagal memuat dokumen', 'error');
        }
      } catch (e) {
        if (silent !== true) this.showToast('Error koneksi dokumen', 'error');
      } finally {
        this.dokumenLoading = false;
      }
    },

    // ============ LAPORAN ============
    async loadRekapKlasifikasi(silent) {
      this.lapKlasLoading = true;
      try {
        var res = await this.callServer('lap_rekap_klasifikasi', { tahun: this.lapKlasTahun });
        if (res && res.success) this.lapKlasData = res.data;
        else if (silent !== true) this.showToast(res.error || 'Gagal rekap klasifikasi', 'error');
      } catch (e) {
        if (silent !== true) this.showToast('Error koneksi rekap', 'error');
      } finally { this.lapKlasLoading = false; }
    },
    async loadRekapPegawai() {
      this.lapPegawaiLoading = true;
      try {
        var res = await this.callServer('lap_rekap_pegawai', { tahun: this.lapKlasTahun });
        if (res && res.success) this.lapPegawaiData = res.data;
        else this.showToast(res.error || 'Gagal rekap pegawai', 'error');
      } catch (e) { /* silent */ }
      finally { this.lapPegawaiLoading = false; }
    },
    async loadRekapUnit() {
      this.lapUnitLoading = true;
      try {
        var res = await this.callServer('lap_rekap_unit', { tahun: this.lapKlasTahun });
        if (res && res.success) this.lapUnitData = res.data;
        else this.showToast(res.error || 'Gagal rekap unit', 'error');
      } catch (e) { /* silent */ }
      finally { this.lapUnitLoading = false; }
    },
    async loadRekapPeriode() {
      this.lapPeriodeLoading = true;
      try {
        var res = await this.callServer('laporan_rekap_periode', { tahun: this.lapKlasTahun });
        if (res && res.success) this.lapPeriodeData = res.data;
        else this.showToast(res.error || 'Gagal rekap periode', 'error');
      } catch (e) { /* silent */ }
      finally { this.lapPeriodeLoading = false; }
    },
    async loadRekapStatus() {
      this.lapStatusLoading = true;
      try {
        var res = await this.callServer('laporan_rekap_status', { tahun: this.lapKlasTahun });
        if (res && res.success) this.lapStatusData = res.data;
        else this.showToast(res.error || 'Gagal rekap status', 'error');
      } catch (e) { /* silent */ }
      finally { this.lapStatusLoading = false; }
    },
    async loadKeterlambatan() {
      this.lapTerlambatLoading = true;
      try {
        var res = await this.callServer('laporan_keterlambatan', { tahun: this.lapKlasTahun });
        if (res && res.success) this.lapTerlambatData = res.data;
        else this.showToast(res.error || 'Gagal keterlambatan', 'error');
      } catch (e) { /* silent */ }
      finally { this.lapTerlambatLoading = false; }
    },
    async loadFileBermasalah() {
      this.lapBermasalahLoading = true;
      try {
        var res = await this.callServer('laporan_file_bermasalah', { tahun: this.lapKlasTahun });
        if (res && res.success) this.lapBermasalahData = res.data;
        else this.showToast(res.error || 'Gagal file bermasalah', 'error');
      } catch (e) { /* silent */ }
      finally { this.lapBermasalahLoading = false; }
    },
    async loadKepatuhan() {
      this.lapKepatuhanLoading = true;
      try {
        var res = await this.callServer('lap_kepatuhan_upload', { tahun: this.lapKlasTahun });
        if (res && res.success) this.lapKepatuhanData = res.data;
        else this.showToast(res.error || 'Gagal kepatuhan', 'error');
      } catch (e) { /* silent */ }
      finally { this.lapKepatuhanLoading = false; }
    },
    async exportKhas() {
      this.exportKhasLoading = true;
      try {
        var res = await this.callServer('laporan_export_khas', { tahun: this.lapKlasTahun });
        if (res && res.success) {
          this.exportKhasResult = res.data;
          if (res.data && res.data.file_url) window.open(res.data.file_url, '_blank');
          this.showToast('Export Khas jadi', 'success');
        } else {
          this.showToast(res.error || 'Gagal export', 'error');
        }
      } catch (e) { this.showToast('Error export', 'error'); }
      finally { this.exportKhasLoading = false; }
    },

    // ============ ANALISA ============
    async loadAnalisa() {
      this.analisaLoading = true;
      var tahun = this.analisaTahun;
      var tab = this.analisaTab;
      var map = {
        unit:     ['analisa_distribusi_unit',      'analisaUnitData'],
        top:      ['analisa_top_pengirim',         'analisaTopData'],
        beban:    ['analisa_beban_pejabat',        'analisaBebanData'],
        sla:      ['analisa_sla_pejabat',          'analisaSlaData'],
        kritis:   ['analisa_kritis_bulanan',       'analisaKritisData'],
        retensi:  ['analisa_retensi',              'analisaRetensiData'],
        korelasi: ['analisa_korelasi_jenis_unit',  'analisaKorelasiData'],
        tte:      ['analisa_tte_ratio',            'analisaTteData']
      };
      var def = map[tab];
      if (!def) { this.analisaLoading = false; return; }
      try {
        var res = await this.callServer(def[0], { tahun: tahun });
        if (res && res.success) this[def[1]] = res.data;
        else this.showToast(res.error || 'Gagal memuat analisa', 'error');
      } catch (e) { this.showToast('Error analisa', 'error'); }
      finally { this.analisaLoading = false; }
    },

    // ============ EVALUASI ============
    async loadEvaluasi() {
      this.evaluasiLoading = true;
      var tahun = this.evaluasiTahun;
      var tab = this.evaluasiTab;
      var map = {
        sla_verif:  ['evaluasi_sla_verifikasi',  'evaluasiSlaVerifData'],
        sla_upload: ['evaluasi_sla_upload',      'evaluasiSlaUploadData'],
        kelengkapan:['evaluasi_kelengkapan',     'evaluasiKelengkapanData'],
        format:     ['evaluasi_format',          'evaluasiFormatData'],
        kepatuhan:  ['evaluasi_kepatuhan_jenis', 'evaluasiKepatuhanData'],
        kadaluarsa: ['evaluasi_kadaluarsa',      'evaluasiKadaluarsaData'],
        fisik:      ['evaluasi_fisik',           'evaluasiFisikData'],
        alih:       ['evaluasi_alih_media',      'evaluasiAlihData']
      };
      var def = map[tab];
      if (!def) { this.evaluasiLoading = false; return; }
      try {
        var res = await this.callServer(def[0], { tahun: tahun });
        if (res && res.success) this[def[1]] = res.data;
        else this.showToast(res.error || 'Gagal memuat evaluasi', 'error');
      } catch (e) { this.showToast('Error evaluasi', 'error'); }
      finally { this.evaluasiLoading = false; }
    },

    // ============ RTL ============
    async loadRtl(page, silent) {
      this.rtlLoading = true;
      try {
        var p = page || this.rtlPage || 1;
        var res = await this.callServer('get_tindak_lanjut_list', {
          page: p,
          search: this.rtlSearch,
          status_rtl: this.rtlFilters.status_rtl,
          sumber_evaluasi: this.rtlFilters.sumber_evaluasi,
          tahun: this.rtlFilters.tahun,
          per_page: 10
        });
        if (res && res.success) {
          this.rtlList = res.data || [];
          this.rtlTotalData = res.total || this.rtlList.length;
          this.rtlTotalPages = res.total_pages || 1;
          this.rtlPage = res.page || p;
        } else if (silent !== true) {
          this.showToast(res.error || 'Gagal memuat RTL', 'error');
        }
      } catch (e) {
        if (silent !== true) this.showToast('Error koneksi RTL', 'error');
      } finally { this.rtlLoading = false; }
    },
    async generateRtl() {
      this.rtlGenerating = true;
      try {
        var res = await this.callServer('generate_tindak_lanjut', {
          sumber_evaluasi: this.rtlGenerateSumber,
          tahun: this.rtlGenerateTahun
        });
        if (res && res.success) {
          this.showToast('Generate RTL: ' + (res.data.generated || 0) + ' baru', 'success');
          this.loadRtl(1);
        } else {
          this.showToast(res.error || 'Gagal generate RTL', 'error');
        }
      } catch (e) { this.showToast('Error generate RTL', 'error'); }
      finally { this.rtlGenerating = false; }
    }
  }
};
</script>
