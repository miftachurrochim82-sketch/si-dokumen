<script>
// SIDOKUMEN - J_State.html (v1.0.4 — tahunOptions select, trenBulanan chart akurat)
// FIX v1.0.3:
//   - dokumenTotalPages tidak duplikat data/computed (Vue3 conflict)
//   - dokumenTotalPagesServer untuk server-side pagination
//   - Tambah computed rtlBaruCount/rtlDiprosesCount/rtlSelesaiCount
//   - paginatedDokumen return langsung (server sudah slice)
window.SidokumenState = {
  data() {
    return {
      dataLoaded: false,

      // ========== DASHBOARD ==========
      dashboardData: {
        totalDokumen: 0, totalBaru: 0, totalDisetujui: 0, pctLengkap: 0,
        totalPegawai: 0, totalJenis: 0, tahun: String(new Date().getFullYear()),
        role: 'viewer', nama: '', totalRtl: 0, rtlBaru: 0, rtlSelesai: 0
      },

      // ========== DOKUMEN ==========
      dokumenList: [],
      dokumenLoading: false,
      dokumenFilters: { search:'', tahun: String(new Date().getFullYear()), jenis_dokumen_id:'', status:'', pegawai_id:'' },
      dokumenPage: 1,
      dokumenPerPage: 20,
      dokumenTotalPagesServer: 1,
      dokumenTotalData: 0,
      showDokumenForm: false,
      dokumenSaving: false,
      dokumenForm: {
        id:'', pegawai_id:'', jenis_dokumen_id:'', tahun: String(new Date().getFullYear()),
        bulan:'', periode_label:'', judul:'', deskripsi:'',
        file_drive_id:'', file_name:'', file_size:0, file_mime:'',
        status:'baru', uploaded_by:'', catatan:''
      },
      showStatusForm: false,
      statusTarget: {},
      statusBaru: 'disetujui',
      statusCatatan: '',

      // ========== MASTER ==========
      jenisList: [],
      kategoriList: [],
      periodeList: [],
      masterTab: 'jenis',
      showJenisForm: false,
      jenisSaving: false,
      jenisForm: {
        id:'', kode:'', nama:'', kategori:'', periode:'',
        urutan:0, status_aktif:'true', keterangan:''
      },

      // ========== LAPORAN ==========
      laporanTab: 'klasifikasi',
      lapKlasData: null, lapKlasLoading: false, lapKlasTahun: String(new Date().getFullYear()),
      lapPegawaiData: null, lapPegawaiLoading: false,
      lapUnitData: null, lapUnitLoading: false,
      lapPeriodeData: null, lapPeriodeLoading: false,
      lapStatusData: null, lapStatusLoading: false,
      lapTerlambatData: null, lapTerlambatLoading: false,
      lapBermasalahData: null, lapBermasalahLoading: false,
      lapKepatuhanData: null, lapKepatuhanLoading: false,
      exportKhasResult: null, exportKhasLoading: false,

      // ========== ANALISA ==========
      analisaTab: 'unit',
      analisaTahun: String(new Date().getFullYear()),
      analisaLoading: false,
      analisaUnitData: null,
      analisaTopData: null,
      analisaBebanData: null,
      analisaSlaData: null,
      analisaKritisData: null,
      analisaRetensiData: null,
      analisaKorelasiData: null,
      analisaTteData: null,

      // ========== EVALUASI ==========
      evaluasiTab: 'sla_verif',
      evaluasiTahun: String(new Date().getFullYear()),
      evaluasiLoading: false,
      evaluasiSlaVerifData: null,
      evaluasiSlaUploadData: null,
      evaluasiKelengkapanData: null,
      evaluasiFormatData: null,
      evaluasiKepatuhanData: null,
      evaluasiKadaluarsaData: null,
      evaluasiFisikData: null,
      evaluasiAlihData: null,

      // ========== RTL ==========
      rtlList: [],
      rtlLoading: false,
      rtlSaving: false,
      rtlGenerating: false,
      rtlGenerateSumber: 'semua',
      rtlGenerateTahun: String(new Date().getFullYear()),
      rtlSearch: '',
      rtlFilters: { status_rtl:'', sumber_evaluasi:'', tahun:'' },
      rtlPage: 1,
      rtlTotalPages: 1,
      rtlTotalData: 0,
      showRtlForm: false,
      showRtlStatusForm: false,
      rtlForm: {
        id:'', sumber_evaluasi:'manual', judul_rtl:'', deskripsi:'',
        assigned_to:'', due_date:'', status_rtl:'baru', progress_pct:0,
        dokumen_terkait:'', catatan:''
      },
      rtlStatusTarget: {},
      rtlStatusBaru: 'diproses',
      rtlStatusProgress: 0,
      rtlStatusCatatan: '',

      // ========== UI ==========
      rowMenuId: null,
      // Tren 12 bulan dari server (L7 dua tahun) — lebih akurat dari sample halaman
      trenBulanan: { keys: [], counts: {} }
    };
  },

  computed: {
    // -------- Tahun: opsi select (tahun saat ini, -1, -2 + tahun yang ada di data) --------
    tahunOptions() {
      var now = String(new Date().getFullYear());
      var set = {};
      set[now] = 1;
      set[String(Number(now) - 1)] = 1;
      set[String(Number(now) - 2)] = 1;
      set[String(Number(now) - 3)] = 1;
      (this.dokumenList || []).forEach(function (r) {
        var t = String(r.tahun || '').trim();
        if (/^\d{4}$/.test(t)) set[t] = 1;
      });
      return Object.keys(set).sort().reverse();
    },

    // -------- Dokumen: filter client-side (safety) --------
    filteredDokumen() {
      var f = this.dokumenFilters || {};
      var q = String(f.search || '').toLowerCase().trim();
      return (this.dokumenList || []).filter(function (r) {
        if (f.tahun && String(r.tahun) !== String(f.tahun)) return false;
        if (f.jenis_dokumen_id && String(r.jenis_dokumen_id) !== String(f.jenis_dokumen_id)) return false;
        if (f.status && String(r.status).toLowerCase() !== String(f.status).toLowerCase()) return false;
        if (f.pegawai_id && String(r.pegawai_id) !== String(f.pegawai_id)) return false;
        if (q) {
          var hay = [r.judul, r.deskripsi, r.catatan, r.file_name, r.pegawai_id].join(' ').toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
    },
    // Server sudah slice → jangan slice lagi
    paginatedDokumen() { return this.filteredDokumen; },

    // -------- RTL counters (dipakai dashboard & rtl header) --------
    rtlBaruCount() {
      return (this.rtlList || []).filter(function (r) {
        return String(r.status_rtl || '').toLowerCase() === 'baru';
      }).length;
    },
    rtlDiprosesCount() {
      return (this.rtlList || []).filter(function (r) {
        return String(r.status_rtl || '').toLowerCase() === 'diproses';
      }).length;
    },
    rtlSelesaiCount() {
      return (this.rtlList || []).filter(function (r) {
        return String(r.status_rtl || '').toLowerCase() === 'selesai';
      }).length;
    },
    rtlBatalCount() {
      return (this.rtlList || []).filter(function (r) {
        return String(r.status_rtl || '').toLowerCase() === 'batal';
      }).length;
    },

    // -------- Charts --------
    chartTrenLabels() {
      var labels = [];
      var names = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
      var now = new Date();
      for (var i = 11; i >= 0; i--) {
        var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        labels.push(names[d.getMonth()] + ' ' + String(d.getFullYear()).slice(2));
      }
      return labels;
    },
    chartTrenDatasets() {
      var keys, counts;
      if (this.trenBulanan && this.trenBulanan.keys && this.trenBulanan.keys.length) {
        keys = this.trenBulanan.keys;
        counts = this.trenBulanan.counts;
      } else {
        // Fallback: sample halaman data (kurang akurat — dipakai sampai L7 termuat)
        counts = {}; keys = [];
        var now = new Date();
        for (var i = 11; i >= 0; i--) {
          var d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          var k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
          keys.push(k);
          counts[k] = 0;
        }
        (this.dokumenList || []).forEach(function (r) {
          var t = r.created_at || r.tanggal || '';
          var k2 = String(t).slice(0, 7);
          if (counts[k2] !== undefined) counts[k2]++;
        });
      }
      return [{ label: 'Upload', data: keys.map(function (k) { return counts[k] || 0; }) }];
    },
    chartTrenColors() { return ['#065f46']; },
    chartStatusLabels() { return ['Baru','Menunggu','Disetujui','Revisi','Ditolak']; },
    chartStatusDatasets() {
      var c = { baru:0, menunggu:0, disetujui:0, revisi:0, ditolak:0 };
      (this.dokumenList || []).forEach(function (r) {
        var s = String(r.status || 'baru').toLowerCase();
        if (c[s] !== undefined) c[s]++;
      });
      return [{ label: 'Status', data: [c.baru, c.menunggu, c.disetujui, c.revisi, c.ditolak] }];
    },
    chartStatusColors() { return ['#94a3b8','#f59e0b','#10b981','#f97316','#f43f5e']; },

    // -------- Filter defs (opsional kalau template pakai filter-dynamic) --------
    dokumenFilterDefs() {
      var self = this;
      return [
        { key:'search', label:'Pencarian', type:'text', placeholder:'Cari judul, file, catatan...', span:2 },
        { key:'tahun', label:'Tahun', type:'text', placeholder:'2026' },
        { key:'jenis_dokumen_id', label:'Jenis', type:'select',
          options: (this.jenisList||[]).map(function(j){ return { value: j.id, label: j.nama }; }) },
        { key:'status', label:'Status', type:'select', options:[
          { value:'baru', label:'Baru' },
          { value:'menunggu', label:'Menunggu' },
          { value:'disetujui', label:'Disetujui' },
          { value:'revisi', label:'Revisi' },
          { value:'ditolak', label:'Ditolak' }
        ]}
      ];
    }
  }
};
</script>
