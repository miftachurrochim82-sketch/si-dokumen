<script>
// SIDOKUMEN - J_App.html (v1.0.3 — icon menu laporan beda dari dokumen)
var SidokumenMixin = {
  // Scope helper — mine/all via AppCore
  // getMyScope/setMyScope akan di-override oleh AppCore.create instance
  data: function () { return Object.assign({}, window.SidokumenState.data()); },
  computed: Object.assign({}, window.SidokumenState.computed),
  methods: Object.assign({},
    window.SidokumenHelpers.methods,
    window.SidokumenApi.methods,
    window.SidokumenActions.methods
  )
};

// Scope global helper (fallback bila AppCore belum load)
window.getMyScope = function(){ try{ return window.AppCore ? AppCore.getMyScope() : 'all'; }catch(e){ return 'all'; } };
window.setMyScope = function(v){ try{ if(window.AppCore) AppCore.setMyScope(v); else localStorage.setItem('sidokumen_scope', v); }catch(e){} };

var app = AppCore.create({
  appCode: 'SIDOKUMEN',
  appTitle: 'SIDOKUMEN',
  initialPage: 'dashboard',
  storagePrefix: 'sidokumen',
  platformUrl: 'https://script.google.com/macros/s/AKfycbwh_OUVqmxLcuF81FHmPZtT33Wrm8Ce9Da1SQ3hfkSr7gM5P8ofyAlHSgW40mq3eo-PoQ/exec',
  brand: {
    title: 'SIDOKUMEN',
    subtitle: 'Gudang Dokumen Kinerja — Laporan 12 + Analisa 10 + Evaluasi 8 + RTL 5',
    logoIcon: 'fa-solid fa-folder-tree',
    logoChar: 'SD',
    logoSvg: ''
  },
  menu: [
    { name: 'Utama', items: [
      { id: 'dashboard', label: 'Dashboard', icon: 'fa-solid fa-gauge-high' },
      { id: 'dokumen',   label: 'Dokumen',   icon: 'fa-solid fa-file-lines' },
      { id: 'laporan',   label: 'Laporan',   icon: 'fa-solid fa-table-list' }
    ]},
    { name: 'Analisa', items: [
      { id: 'analisa',  label: 'Analisa',  icon: 'fa-solid fa-chart-line' },
      { id: 'evaluasi', label: 'Evaluasi', icon: 'fa-solid fa-clipboard-check' },
      { id: 'rtl',      label: 'RTL',      icon: 'fa-solid fa-list-check' }
    ]},
    { name: 'Master', items: [
      { id: 'master', label: 'Jenis Dokumen', icon: 'fa-solid fa-tags' }
    ]},
    { name: 'Sistem', items: [
      { id: 'pengaturan', label: 'Pengaturan', icon: 'fa-solid fa-gear' }
    ]}
  ],
  pageIcons: {
    dashboard: 'fa-solid fa-gauge-high',
    dokumen:   'fa-solid fa-file-lines',
    laporan:   'fa-solid fa-table-list',
    analisa:   'fa-solid fa-chart-line',
    evaluasi:  'fa-solid fa-clipboard-check',
    rtl:       'fa-solid fa-list-check',
    master:    'fa-solid fa-tags'
  },
  onNavigate: function (vm, page) {
    if (page === 'dashboard') vm.loadAll();
    if (page === 'dokumen')   { if (!vm.dokumenLoading) vm.loadDokumen(1); }
    if (page === 'laporan')   {
      if (!vm.lapKlasData)    vm.loadRekapKlasifikasi();
      if (!vm.lapPegawaiData) vm.loadRekapPegawai();
    }
    if (page === 'analisa')   { if (!vm.analisaUnitData) vm.loadAnalisa(); }
    if (page === 'evaluasi')  { if (!vm.evaluasiSlaVerifData) vm.loadEvaluasi(); }
    if (page === 'rtl')       { if (!vm.rtlList.length) vm.loadRtl(1); }
    if (page === 'master')    { if (!vm.jenisList.length) vm.loadJenis(); }
  },
  initApp: async function (vm) {
    if (vm.dataLoaded) return;
    await vm.loadAll(true);
    vm.dataLoaded = true;
  },
  mixins: [SidokumenMixin]
});
app.mount('#app');
</script>
