<script>
// SIDOKUMEN - J_Helpers.html (v1.0.3 — formatBytes_)
window.SidokumenHelpers = {
  methods: {
    fmtTgl(val) {
      if (!val) return '—';
      try {
        var d = new Date(val);
        if (isNaN(d.getTime())) return String(val);
        var dd = String(d.getDate()).padStart(2, '0');
        var mm = String(d.getMonth() + 1).padStart(2, '0');
        return dd + '/' + mm + '/' + d.getFullYear();
      } catch (e) { return String(val); }
    },
    formatTanggal(val) { return this.fmtTgl(val); },

    badgeStatusDokumen(status) {
      var s = String(status || '').toLowerCase().trim();
      if (s === 'disetujui' || s === 'selesai') return 'disetujui';
      if (s === 'baru' || s === 'draft') return 'draft';
      if (s === 'menunggu' || s === 'diproses') return 'menunggu';
      if (s === 'revisi') return 'revisi';
      if (s === 'ditolak' || s === 'batal') return 'ditolak';
      return 'proses';
    },
    badgeStatusRtl(status) {
      var s = String(status || '').toLowerCase().trim();
      if (s === 'baru') return 'menunggu';
      if (s === 'diproses') return 'proses';
      if (s === 'selesai' || s === 'disetujui') return 'disetujui';
      if (s === 'batal' || s === 'ditolak') return 'ditolak';
      return 'draft';
    },
    badgeSumberEvaluasi(sumber) {
      var s = String(sumber || '').toUpperCase().trim();
      if (s === 'E3') return 'revisi';
      if (s === 'E4') return 'menunggu';
      if (s === 'E1') return 'proses';
      if (s === 'E6') return 'draft';
      if (s === 'E5') return 'disetujui';
      if (s === 'MANUAL') return 'info';
      return 'info';
    },
    badgeKategori(k) {
      var s = String(k || '').toUpperCase();
      if (s === 'KINERJA_UTAMA') return 'disetujui';
      if (s === 'PERUBAHAN') return 'menunggu';
      if (s === 'PENILAIAN') return 'proses';
      if (s === 'LAPORAN') return 'info';
      return 'draft';
    },

    // Helper lookup (cache map di computed nanti kalau perlu)
    _findMap_(list, keys) {
      var m = {};
      (list || []).forEach(function (r) {
        keys.forEach(function (k) {
          if (r[k] != null && r[k] !== '') m[String(r[k]).trim()] = r;
        });
      });
      return m;
    },
    namaJenisDokumen_(id) {
      var key = String(id || '').trim();
      if (!key) return '—';
      var list = this.jenisList || [];
      for (var i = 0; i < list.length; i++) {
        var j = list[i] || {};
        if (String(j.id).trim() === key) return j.nama || j.kode || key;
      }
      return key;
    },
    namaPegawai_(id) {
      if (!id) return '';
      var list = this.masterPegawaiList || [];
      var target = String(id).trim();
      for (var i = 0; i < list.length; i++) {
        var p = list[i] || {};
        if (String(p.id || p.pegawai_id).trim() === target) return p.nama_lengkap || p.nama || '';
      }
      return id;
    },
    nipPegawai(id) {
      if (!id) return '-';
      var list = this.masterPegawaiList || [];
      var target = String(id).trim();
      for (var i = 0; i < list.length; i++) {
        var p = list[i] || {};
        if (String(p.id || p.pegawai_id).trim() === target) return p.nip || '-';
      }
      return '-';
    },
    pct_(num, den) {
      if (!den) return 0;
      return Math.round((Number(num || 0) / Number(den)) * 100);
    },
    formatBytes_(n) {
      var v = Number(n) || 0;
      if (v < 1024) return v + ' B';
      if (v < 1024 * 1024) return (v / 1024).toFixed(1) + ' KB';
      return (v / (1024 * 1024)).toFixed(2) + ' MB';
    },
    clampPct_(v) {
      var n = Number(v) || 0;
      return Math.max(0, Math.min(100, n));
    },

    toggleRowMenu(id) { this.rowMenuId = this.rowMenuId === id ? null : id; },
    closeMenu() { this.rowMenuId = null; }
  }
};
</script>
