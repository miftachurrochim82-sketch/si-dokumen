<!-- SIDOKUMEN - V_Master.html (v1.0.2 — minor rapi) -->
<section v-if="currentPage === 'master'" class="space-y-6 animate-fade-in">
  <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-3">
    <div>
      <h2 class="text-2xl font-bold tracking-tight flex items-center gap-2 text-slate-800 dark:text-white">
        <i class="fa-solid fa-tags text-emerald-600 dark:text-emerald-400"></i> Master Jenis Dokumen
      </h2>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">10 jenis awal PK, SKP Tahunan, SKP Periodik, PK Perubahan, Penilaian Bulanan/Tahunan, Lapkin, LHKPN, IKI, Lainnya</p>
    </div>
    <button class="btn btn-primary" @click="openJenisCreate()"><i class="fa-solid fa-plus"></i> Tambah Jenis</button>
  </div>

  <div class="card overflow-hidden !p-0">
    <div class="flex items-center justify-between p-3 border-b">
      <h3 class="font-bold text-sm">M_JENIS_DOKUMEN</h3>
      <span class="text-[11px] text-slate-400">{{ jenisList.length }} data</span>
    </div>
    <div class="table-scroll">
      <table class="w-full text-xs">
        <thead class="border-b bg-slate-50 dark:bg-slate-800/50">
          <tr>
            <th class="text-left py-2 px-3 min-w-[100px]">Kode</th>
            <th class="text-left py-2 px-3 min-w-[240px]">Nama</th>
            <th class="text-left py-2 px-3 min-w-[140px]">Kategori</th>
            <th class="text-left py-2 px-3 min-w-[100px]">Periode</th>
            <th class="text-left py-2 px-3 min-w-[100px]">Status</th>
            <th class="text-right py-2 px-3 min-w-[120px]">Aksi</th>
          </tr>
        </thead>
        <tbody class="divide-y">
          <tr v-for="j in jenisList" :key="j.id" class="hover:bg-slate-50 dark:hover:bg-slate-800/30">
            <td class="py-2 px-3 font-mono font-bold">{{ j.kode }}</td>
            <td class="py-2 px-3">{{ j.nama }}</td>
            <td class="py-2 px-3"><app-badge size="sm" :status="badgeKategori(j.kategori)" :label="j.kategori||'—'"></app-badge></td>
            <td class="py-2 px-3">{{ j.periode }}</td>
            <td class="py-2 px-3"><app-badge size="sm" :status="String(j.status_aktif)==='false' ? 'nonaktif' : 'aktif'" :label="String(j.status_aktif)==='false' ? 'nonaktif' : 'aktif'"></app-badge></td>
            <td class="py-2 px-3 text-right">
              <div class="flex gap-1 justify-end">
                <button class="btn-icon" @click="jenisForm=Object.assign({}, j); showJenisForm=true" title="Edit"><i class="fa-solid fa-pen"></i></button>
                <button class="btn-icon-danger" @click="hapusJenis(j)" title="Hapus"><i class="fa-solid fa-trash"></i></button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
