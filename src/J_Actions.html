<script>
// SIDOKUMEN - J_Actions.html (v1.0.3 — form submit + role-guard + open* helper)
// FIX v1.0.3:
//   - Tambah openDokumenCreate/openJenisCreate/openRtlCreate (dipisah dari inline template)
//   - Role-guard: user biasa auto-fill pegawai_id sendiri
//   - Konsisten error handling
window.SidokumenActions = {
  methods: {
    // ============================================================
    // DOKUMEN
    // ============================================================
    openDokumenCreate() {
      var y = String(new Date().getFullYear());
      this.dokumenForm = {
        id: '', pegawai_id: '', jenis_dokumen_id: '', tahun: y, bulan: '', periode_label: '',
        judul: '', deskripsi: '', file_drive_id: '', file_name: '', file_size: 0,
        file_mime: '', status: 'baru', uploaded_by: '', catatan: ''
      };
      // Role-guard: user biasa otomatis atas nama sendiri
      if (!this.isAdmin && this.currentUser && this.currentUser.pegawai_id) {
        this.dokumenForm.pegawai_id = this.currentUser.pegawai_id;
      }
      this.showDokumenForm = true;
      // Reset input file setelah modal ke-render (v-if)
      var self = this;
      this.$nextTick(function () {
        try { if (self.$refs && self.$refs.fileDokumen) self.$refs.fileDokumen.value = ''; } catch (e) {}
      });
    },

    openDokumenEdit(r) {
      var y = String(new Date().getFullYear());
      this.dokumenForm = Object.assign({
        id: '', pegawai_id: '', jenis_dokumen_id: '', tahun: y,
        bulan: '', periode_label: '', judul: '', deskripsi: '',
        file_drive_id: '', file_name: '', file_size: 0, file_mime: '',
        status: 'baru', uploaded_by: '', catatan: ''
      }, r || {});
      // Role-guard: cegah spoofing pegawai_id untuk non-admin
      if (!this.isAdmin && this.currentUser && this.currentUser.pegawai_id) {
        this.dokumenForm.pegawai_id = this.currentUser.pegawai_id;
      }
      this.showDokumenForm = true;
      var self = this;
      this.$nextTick(function () {
        try { if (self.$refs && self.$refs.fileDokumen) self.$refs.fileDokumen.value = ''; } catch (e) {}
      });
    },

    async simpanDokumen() {
      // Role-guard: user biasa auto-fill pegawai_id sendiri
      if (!this.isAdmin) {
        this.dokumenForm.pegawai_id = (this.currentUser && this.currentUser.pegawai_id) || '';
      }
      if (!this.dokumenForm.pegawai_id) { this.showToast('Pegawai wajib', 'warning'); return; }
      if (!this.dokumenForm.jenis_dokumen_id) { this.showToast('Jenis dokumen wajib', 'warning'); return; }
      if (!this.dokumenForm.tahun) { this.showToast('Tahun wajib', 'warning'); return; }

      this.dokumenSaving = true;
      try {
        var fileInput = this.$refs.fileDokumen;
        var fileBase64 = '', fileName = '', fileMime = '';

        if (fileInput && fileInput.files && fileInput.files[0]) {
          var file = fileInput.files[0];
          if (file.size > 10 * 1024 * 1024) {
            this.showToast('File >10MB', 'error');
            return;
          }
          if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
            this.showToast('File harus PDF', 'warning');
          }
          fileName = file.name;
          fileMime = file.type || 'application/pdf';
          fileBase64 = await new Promise(function (resolve, reject) {
            var reader = new FileReader();
            reader.onload = function (e) { resolve(e.target.result.split(',')[1]); };
            reader.onerror = function (e) { reject(e); };
            reader.readAsDataURL(file);
          });
        }

        var payload = { record: this.dokumenForm };
        if (fileBase64) {
          payload.file_base64 = fileBase64;
          payload.file_name = fileName;
          payload.file_mime = fileMime;
        }

        var res = await this.callServer('save_dokumen', payload);
        if (res && res.success) {
          this.showToast('Dokumen disimpan', 'success');
          this.showDokumenForm = false;
          this.loadDokumen(this.dokumenForm.id ? this.dokumenPage : 1);
          this.loadRekapKlasifikasi();
        } else {
          this.showToast(res.error || 'Gagal simpan dokumen', 'error');
        }
      } catch (e) {
        this.showToast('Error simpan dokumen: ' + e.message, 'error');
      } finally {
        this.dokumenSaving = false;
      }
    },

    async hapusDokumen(r) {
      if (!confirm('Hapus "' + (r.judul || r.file_name || r.id) + '"?')) return;
      try {
        var res = await this.callServer('delete_dokumen', { id: r.id });
        if (res && res.success) {
          this.showToast('Dihapus', 'success');
          this.loadDokumen(this.dokumenPage);
        } else {
          this.showToast(res.error || 'Gagal hapus', 'error');
        }
      } catch (e) { this.showToast('Error hapus', 'error'); }
    },

    openDokumenStatus(r) {
      this.statusTarget = r;
      this.statusBaru = r.status || 'menunggu';
      this.statusCatatan = '';
      this.showStatusForm = true;
    },

    async verifikasiDokumen() {
      this.dokumenSaving = true;
      try {
        var res = await this.callServer('verifikasi_dokumen', {
          id: this.statusTarget.id,
          status_baru: this.statusBaru,
          catatan: this.statusCatatan
        });
        if (res && res.success) {
          this.showToast('Status diubah', 'success');
          this.showStatusForm = false;
          this.loadDokumen(this.dokumenPage);
        } else {
          this.showToast(res.error || 'Gagal ubah status', 'error');
        }
      } catch (e) { this.showToast('Error verifikasi', 'error'); }
      finally { this.dokumenSaving = false; }
    },

    // ============================================================
    // JENIS DOKUMEN
    // ============================================================
    openJenisCreate() {
      this.jenisForm = {
        id:'', kode:'', nama:'', kategori:'', periode:'',
        urutan:0, status_aktif:'true', keterangan:''
      };
      this.showJenisForm = true;
    },

    openJenisEdit(j) {
      this.jenisForm = Object.assign({
        id:'', kode:'', nama:'', kategori:'', periode:'',
        urutan:0, status_aktif:'true', keterangan:''
      }, j || {});
      this.showJenisForm = true;
    },

    async simpanJenis() {
      if (!this.jenisForm.nama) { this.showToast('Nama wajib', 'warning'); return; }
      if (!this.jenisForm.kode) { this.showToast('Kode wajib', 'warning'); return; }
      this.jenisSaving = true;
      try {
        var res = await this.callServer('save_jenis', { record: this.jenisForm });
        if (res && res.success) {
          this.showToast('Jenis disimpan', 'success');
          this.showJenisForm = false;
          this.loadJenis();
        } else {
          this.showToast(res.error || 'Gagal simpan jenis', 'error');
        }
      } catch (e) { this.showToast('Error simpan jenis', 'error'); }
      finally { this.jenisSaving = false; }
    },

    async hapusJenis(r) {
      if (!confirm('Hapus jenis "' + (r.nama || r.kode) + '"?')) return;
      try {
        var res = await this.callServer('delete_jenis', { id: r.id });
        if (res && res.success) {
          this.showToast('Dihapus', 'success');
          this.loadJenis();
        } else {
          this.showToast(res.error || 'Gagal hapus', 'error');
        }
      } catch (e) { this.showToast('Error hapus', 'error'); }
    },

    // ============================================================
    // RTL
    // ============================================================
    openRtlCreate() {
      this.rtlForm = {
        id:'', sumber_evaluasi:'manual', judul_rtl:'', deskripsi:'',
        assigned_to:'', due_date:'', status_rtl:'baru', progress_pct:0,
        dokumen_terkait:'', catatan:''
      };
      this.showRtlForm = true;
    },

    openRtlEdit(r) {
      this.rtlForm = Object.assign({
        id:'', sumber_evaluasi:'manual', judul_rtl:'', deskripsi:'',
        assigned_to:'', due_date:'', status_rtl:'baru', progress_pct:0,
        dokumen_terkait:'', catatan:''
      }, r || {});
      // Legacy: kalau ada field `judul` (bukan `judul_rtl`), copy
      if (r && r.judul && !this.rtlForm.judul_rtl) this.rtlForm.judul_rtl = r.judul;
      this.showRtlForm = true;
    },

    async simpanRtl() {
      if (!String(this.rtlForm.judul_rtl || '').trim()) {
        this.showToast('Judul RTL wajib', 'warning');
        return;
      }
      this.rtlSaving = true;
      try {
        var res = await this.callServer('save_tindak_lanjut', { record: this.rtlForm });
        if (res && res.success) {
          this.showToast('RTL disimpan', 'success');
          this.showRtlForm = false;
          this.loadRtl(this.rtlPage);
        } else {
          this.showToast(res.error || 'Gagal simpan RTL', 'error');
        }
      } catch (e) { this.showToast('Error simpan RTL', 'error'); }
      finally { this.rtlSaving = false; }
    },

    async hapusRtl(r) {
      if (!confirm('Hapus RTL "' + (r.judul_rtl || r.judul || r.id) + '"?')) return;
      try {
        var res = await this.callServer('delete_tindak_lanjut', { id: r.id });
        if (res && res.success) {
          this.showToast('RTL dihapus', 'success');
          this.loadRtl(this.rtlPage);
        } else {
          this.showToast(res.error || 'Gagal hapus RTL', 'error');
        }
      } catch (e) { this.showToast('Error hapus RTL', 'error'); }
    },

    openRtlStatus(r) {
      this.rtlStatusTarget = r;
      this.rtlStatusBaru = r.status_rtl || r.status || 'diproses';
      this.rtlStatusProgress = Number(r.progress_pct) || 0;
      this.rtlStatusCatatan = '';
      this.showRtlStatusForm = true;
    },

    async ubahStatusRtl() {
      this.rtlSaving = true;
      try {
        var res = await this.callServer('ubah_status_tindak_lanjut', {
          id: this.rtlStatusTarget.id,
          status_rtl: this.rtlStatusBaru,
          progress_pct: this.rtlStatusProgress,
          catatan: this.rtlStatusCatatan
        });
        if (res && res.success) {
          this.showToast('Status RTL diubah', 'success');
          this.showRtlStatusForm = false;
          this.loadRtl(this.rtlPage);
        } else {
          this.showToast(res.error || 'Gagal ubah status', 'error');
        }
      } catch (e) { this.showToast('Error ubah status', 'error'); }
      finally { this.rtlSaving = false; }
    }
  }
};
</script>
